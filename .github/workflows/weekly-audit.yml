name: Weekly editorial audit

# Human safety net for the autonomous content pipeline. Summarises the FLAG-tier
# claims the accuracy gate recorded in content/manifests/ for guides published in
# the last 7 days, and delivers a digest (email via Resend if RESEND_API_KEY +
# DIGEST_TO are set; always written to the run's Step Summary). Read-only — it
# never blocks publishing. Run manually any time from the Actions tab.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. GitHub cron is best-effort and may be delayed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build + send the weekly audit digest
        run: python scripts/audit_digest.py --days 7
