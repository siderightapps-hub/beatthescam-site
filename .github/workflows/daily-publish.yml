name: Daily AI Publish

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new topics to publish this run"
        required: false
        default: "1"
      rewrite_thin:
        description: "Rewrite thin guides? (true/false)"
        required: false
        default: "false"
      rewrite_limit:
        description: "Max thin guides to rewrite per run"
        required: false
        default: "10"
  schedule:
    # Daily at 05:07 UTC (06:07 BST). GitHub cron is best-effort and can be
    # delayed by hours. Generation runs through scripts/content_gate.py
    # (deterministic checks + LLM judge) before anything is written; gate
    # failures are quarantined.
    #
    # HUMAN-REVIEW GATE (2026-06-25): this workflow NO LONGER commits to main.
    # It opens a pull request for editorial review instead. Nothing goes live,
    # gets ads, or is tweeted until a human merges the PR. This satisfies
    # Google's requirement that automatically-generated content be reviewed or
    # curated before it carries advertising. Auto-tweet now lives in
    # tweet-on-publish.yml, which fires only after the PR is merged to main.
    - cron: '7 5 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write          # gh label create manages labels via the issues API

# Serialise with daily-search-console.yml: both pipelines branch off main and
# regenerate dist/sitemap.xml from posts.json. Same group name in both files
# queues them instead of letting them race off the same base.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Scheduled runs have no inputs, so the fallback applies: 1 article/day.
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '1' }}
      REWRITE_THIN: ${{ github.event.inputs.rewrite_thin || 'false' }}
      REWRITE_LIMIT: ${{ github.event.inputs.rewrite_limit || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-claude.txt

      - name: Publish new topics
        id: publish
        run: |
          OUTPUT=$(python scripts/run_daily_publish.py \
            --queue  content/daily-publish-queue.csv \
            --topics content/topics-claude-template.csv \
            --posts  content/posts.json \
            --batch-size "$BATCH_SIZE" \
            --model  claude-haiku-4-5-20251001 2>&1)
          echo "$OUTPUT"
          # Extract new slugs from the script's marker line so the PR body can
          # list them (only gate-PASSED slugs are emitted).
          SLUGS=$(echo "$OUTPUT" | grep "^NEW_ARTICLE_SLUGS=" | tail -1 | cut -d= -f2)
          echo "new_slugs=$SLUGS" >> $GITHUB_OUTPUT
          echo "Captured new slugs: $SLUGS"

      - name: Rewrite thin guides (optional)
        if: env.REWRITE_THIN == 'true'
        run: |
          python scripts/rewrite_thin_guides.py \
            --posts     content/posts.json \
            --threshold 400 \
            --limit     "$REWRITE_LIMIT" \
            --model     claude-haiku-4-5-20251001

      - name: Build site
        run: python scripts/build.py

      - name: Verify build produced output (fail loudly on silent build failures)
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found — build.py exited silently without producing output"
            exit 1
          fi
          if [ ! -f dist/robots.txt ]; then
            echo "ERROR: dist/robots.txt not found — build.py did not generate robots.txt"
            exit 1
          fi
          if [ ! -f dist/_redirects ]; then
            echo "ERROR: dist/_redirects not found — build.py did not generate _redirects"
            exit 1
          fi
          POST_COUNT=$(find dist/guides -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$POST_COUNT" -lt 50 ]; then
            echo "ERROR: only $POST_COUNT post directories found in dist/guides — build looks incomplete"
            exit 1
          fi
          echo "Build verified: $POST_COUNT post directories, all required files present"

      - name: Open review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage everything the pipeline produces. dist/ is derived but committed
          # so Netlify serves it as-is on merge.
          git add content/manifests/ content/posts.json \
                  content/topics-claude-template.csv \
                  content/daily-publish-queue.csv \
                  dist/

          if git diff --cached --quiet; then
            echo "ℹ️  Nothing generated this run (queue empty / no changes) — no PR to open."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/daily-publish-$(date -u +%Y%m%d)-${{ github.run_id }}"
          SLUGS="${{ steps.publish.outputs.new_slugs }}"

          git checkout -b "$BRANCH"
          git commit -m "Daily AI publish (review): $DATE"
          git push origin "$BRANCH"

          # Idempotent label; ignore "already exists".
          gh label create auto-content --color 1f6feb --description "Auto-generated content awaiting editorial review" 2>/dev/null || true

          BODY=$(cat <<EOF
          Automated daily-publish output for **editorial review**. Generated by Claude and passed the automated accuracy gate (\`scripts/content_gate.py\`). **Merging this PR publishes the guide(s) and enables advertising on them** — review before merging.

          **New guide slug(s):** \`${SLUGS:-none captured}\`

          ### Reviewer checklist
          - [ ] Reporting routes / phone numbers correct and from the verified canon
          - [ ] Reimbursement framing uses the mandatory APP rules (not the old CRM code)
          - [ ] No US-style "fraud alert / credit freeze" (UK = Cifas Protective Registration)
          - [ ] 7726 attributed to the mobile networks, not the NCSC
          - [ ] No unsafe threat-dismissal advice (esp. sextortion/deepfake guides)
          - [ ] Brand/domain claims are not false absolutes ("always/never")
          - [ ] Flag-tier notes in \`content/manifests/\` reviewed

          On merge, \`tweet-on-publish.yml\` will tweet the new guide(s).
          EOF
          )

          gh pr create --base main --head "$BRANCH" \
            --title "Daily AI publish for review: $DATE" \
            --body "$BODY" \
            --label auto-content \
          || gh pr create --base main --head "$BRANCH" \
            --title "Daily AI publish for review: $DATE" \
            --body "$BODY"

          echo "✅ Opened review PR from $BRANCH"
