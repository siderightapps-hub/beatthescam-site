name: Daily Search Console Articles

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only — show gaps without generating (true/false)"
        required: false
        default: "false"
      days:
        description: "Days of Search Console data to analyse"
        required: false
        default: "28"
  schedule:
    # 05:23 UTC (06:23 BST). Re-enabled 2026-06-19 after the P1 accuracy gate — the
    # generator runs every draft through scripts/content_gate.py before publishing.
    # Queued behind daily-publish via the concurrency group below.
    - cron: '23 5 * * *'

permissions:
  contents: write

# Serialise with daily-publish.yml: the two pipelines both regenerate
# dist/sitemap.xml from posts.json. If they run concurrently the second to
# push will hit a merge conflict on dist/sitemap.xml during rebase. Same
# group name in both workflow files queues them instead of failing.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  search-console-articles:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY:              ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SEARCH_CONSOLE_TOKEN:    ${{ secrets.GOOGLE_SEARCH_CONSOLE_TOKEN }}
      GOOGLE_OAUTH_CREDENTIALS:       ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
      TWITTER_API_KEY:                ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_KEY_SECRET:         ${{ secrets.TWITTER_API_KEY_SECRET }}
      TWITTER_ACCESS_TOKEN:           ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET:    ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      DRY_RUN:  ${{ github.event.inputs.dry_run || 'false' }}
      SC_DAYS:  ${{ github.event.inputs.days    || '28'    }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install \
            anthropic \
            Pillow \
            tweepy \
            python-dotenv \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            rcssmin \
            rjsmin

      - name: Write Google token from secret
        run: |
          echo '${{ secrets.GOOGLE_SEARCH_CONSOLE_TOKEN }}' > token.json
          echo "✅ token.json written"

      - name: Run Search Console article generator
        id: generate
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/search_console_articles.py --dry-run --days "$SC_DAYS"
          else
            # Capture output but surface a real failure instead of swallowing it
            # with `|| true` — a non-zero exit here is usually an expired Search
            # Console OAuth token (rotates ~weekly) and means the gap pipeline is
            # silently doing nothing. Fail loudly so it gets re-authed.
            set +e
            OUTPUT=$(python scripts/search_console_articles.py --days "$SC_DAYS" --limit 1 2>&1)
            CODE=$?
            set -e
            echo "$OUTPUT"
            if [ "$CODE" -ne 0 ]; then
              echo "::error::Search Console article generator failed (exit $CODE) — check the Google OAuth token (token.json) hasn't expired."
              exit "$CODE"
            fi
            # Extract new slugs from output for tweeting
            SLUGS=$(echo "$OUTPUT" | grep "^NEW_ARTICLE_SLUGS=" | cut -d= -f2)
            echo "new_slugs=$SLUGS" >> $GITHUB_OUTPUT
            echo "Generated slugs: $SLUGS"
          fi

      - name: Build site
        if: env.DRY_RUN != 'true'
        run: python scripts/build.py

      - name: Verify build output
        if: env.DRY_RUN != 'true'
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found"
            exit 1
          fi
          if [ ! -f dist/robots.txt ]; then
            echo "ERROR: dist/robots.txt not found"
            exit 1
          fi
          POST_COUNT=$(find dist/guides -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$POST_COUNT" -lt 50 ]; then
            echo "ERROR: only $POST_COUNT post directories found"
            exit 1
          fi
          echo "✅ Build verified: $POST_COUNT post directories"

      - name: Check if content changed
        if: env.DRY_RUN != 'true'
        id: changed
        run: |
          git add content/manifests/ content/posts.json dist/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No new articles generated this run"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          git reset HEAD content/manifests/ content/posts.json dist/

      - name: Commit and push new article + dist
        if: env.DRY_RUN != 'true' && steps.changed.outputs.changed == 'true'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/manifests/ content/posts.json dist/
          git commit -m "Search Console article: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "✅ Push succeeded on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt rejected (non-fast-forward) — retrying"
              sleep 5
              continue
            fi

            # Rebase conflict. dist/ is derived from content/posts.json — never
            # try to merge it. Snapshot our new article, hard-reset to fresh
            # main, merge our additions into the canonical posts.json, then
            # rebuild dist/ from scratch.
            echo "Rebase conflict on attempt $attempt — recovering by snapshot + reset + rebuild"
            git rebase --abort || true
            cp content/posts.json /tmp/posts-ours.json
            git reset --hard origin/main
            python scripts/merge_new_posts.py /tmp/posts-ours.json content/posts.json

            if git diff --quiet content/posts.json; then
              echo "ℹ️  Our new article was already on main — nothing to push"
              exit 0
            fi

            python scripts/build.py
            git add content/manifests/ content/posts.json dist/
            git commit -m "Search Console article: $(date -u +%Y-%m-%d)"
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Tweet new article
        # Re-enabled 2026-06-19: only gate-passed articles are inserted, so
        # new_slugs only ever references content that cleared the accuracy gate.
        if: >
          env.DRY_RUN != 'true' &&
          steps.changed.outputs.changed == 'true' &&
          steps.generate.outputs.new_slugs != ''
        run: |
          # Write .env for tweet script
          cat > .env << EOF
          TWITTER_API_KEY=${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_KEY_SECRET=${{ secrets.TWITTER_API_KEY_SECRET }}
          TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET=${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          EOF

          # Write tweeted_posts.json if it doesn't exist
          if [ ! -f content/tweeted_posts.json ]; then
            echo "{}" > content/tweeted_posts.json
          fi

          # Tweet each new slug
          SLUGS="${{ steps.generate.outputs.new_slugs }}"
          IFS=',' read -ra SLUG_ARRAY <<< "$SLUGS"
          for SLUG in "${SLUG_ARRAY[@]}"; do
            echo "🐦 Tweeting: $SLUG"
            python scripts/tweet_new_articles.py --slug "$SLUG" || echo "Tweet failed for $SLUG"
          done

          # Clean up .env
          rm -f .env

      - name: Save updated tweeted_posts.json
        if: >
          env.DRY_RUN != 'true' &&
          steps.changed.outputs.changed == 'true' &&
          steps.generate.outputs.new_slugs != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/tweeted_posts.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update tweeted_posts.json after auto-tweet"

            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "✅ tweeted_posts.json pushed on attempt $attempt"
                  exit 0
                fi
                echo "Push attempt $attempt rejected (non-fast-forward) — retrying"
                sleep 5
                continue
              fi

              # tweeted_posts.json is just a slug→timestamp dict; conflict
              # means another process added an entry. Snapshot ours, reset,
              # python-merge the dicts, re-commit.
              echo "Rebase conflict on attempt $attempt — recovering by snapshot + reset + merge"
              git rebase --abort || true
              cp content/tweeted_posts.json /tmp/tweeted-ours.json
              git reset --hard origin/main
              python -c "import json, pathlib; ours=json.loads(pathlib.Path('/tmp/tweeted-ours.json').read_text()); bp=pathlib.Path('content/tweeted_posts.json'); base=json.loads(bp.read_text()) if bp.exists() else {}; merged={**base, **ours}; bp.write_text(json.dumps(merged, indent=2, ensure_ascii=False)+chr(10)); print(f'Merged tweeted_posts.json: {len(merged)} entries')"
              if git diff --quiet content/tweeted_posts.json; then
                echo "ℹ️  Nothing new to record — exiting"
                exit 0
              fi
              git add content/tweeted_posts.json
              git commit -m "Update tweeted_posts.json after auto-tweet"
              sleep 5
            done
            echo "Push failed after 3 attempts"
            exit 1
          else
            echo "ℹ️  No changes to tweeted_posts.json"
          fi
