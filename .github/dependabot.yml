# Dependabot — automated dependency update PRs for every ecosystem in the repo.
# Added 2026-06-22 (supply-chain audit fix). Weekly cadence keeps the noise low
# for a small project; security updates are raised immediately regardless.
version: 2
updates:
  # Netlify Functions JS deps (@netlify/blobs) — package.json + package-lock.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # Python content/build pipeline deps — requirements-claude.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # GitHub Actions used by the workflows (checkout, setup-python, CodeQL, …)
  # codeql-action's init/analyze actions are versioned together as one release
  # and MUST land in a single commit — bumping just one leaves them on
  # mismatched versions and CodeQL analysis fails at runtime ("Loaded a
  # configuration file for version X, but running version Y"). This group
  # keeps Dependabot from ever splitting that pair across two PRs again
  # (root-caused 2026-07-11 when PRs #42/#43 did exactly that and both failed CI).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
