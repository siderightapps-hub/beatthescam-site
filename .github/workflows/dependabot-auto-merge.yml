# Auto-merge Dependabot PRs once CI is green, but only for patch/minor bumps —
# major bumps always need a human look. No checkout step (nothing here needs
# repo content, just the PR's own metadata + the GitHub API), so a compromised
# dependency's install scripts can never run in this workflow.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # gh pr checks --watch polls until every check on the PR has finished
      # and exits non-zero if any failed — that's the actual CI gate. Native
      # `gh pr merge --auto` only waits for checks that branch protection
      # marks "required", and main has none, so it would merge immediately
      # without this step.
      - name: Wait for checks, then merge patch/minor bumps
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checks "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --watch --interval 15
          gh pr merge --repo "${{ github.repository }}" --squash "${{ github.event.pull_request.number }}"
