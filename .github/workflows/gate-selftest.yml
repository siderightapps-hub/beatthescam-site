name: Gate self-test

# Two jobs with different triggers, because they cost different things.
#
# `offline` runs the deterministic self-tests — routing, canon, hub schema and
# ad modes. No API key, no network, so it runs AUTOMATICALLY on every push and
# pull request that touches the gate, the build, the canon or the tests. That is
# the release property that matters: gate/validator/hub code cannot be merged
# while its deterministic checks are red or silently skipped (operator review,
# 2026-07-27 — before then nothing ran these in CI at all).
#
# `llm` runs the API-backed fixture suite against the existing ANTHROPIC_API_KEY
# secret, so it can be exercised without anyone holding the key locally. It
# spends money, so it stays manual: click "Run workflow" in the Actions tab.
# Side-effect-free: the self-tests never write posts.json or the quarantine, and
# neither job commits.

on:
  workflow_dispatch:
  push:
    # Every file that can change what these suites assert. A consolidation-only
    # change used to miss this workflow entirely — scripts/corpus.py,
    # corpus_selftest.py, similarity_report.py, release_manifest.py and
    # content/posts.json were all absent, so the six-minute job meant to enforce
    # the feature could be bypassed by editing the feature (operator review,
    # 2026-07-30). Deletion-only migration halves are caught by the self-test
    # rather than the validator, which makes this filter load-bearing.
    paths: &selftest_paths
      - 'scripts/canon.py'
      - 'scripts/corpus.py'
      - 'scripts/corpus_selftest.py'
      - 'scripts/content_gate.py'
      - 'scripts/build.py'
      - 'scripts/gate_quickanswer_selftest.py'
      - 'scripts/hub_selftest.py'
      - 'scripts/gate_selftest.py'
      - 'scripts/generate_content_claude.py'
      - 'scripts/search_console_articles.py'
      - 'scripts/similarity_report.py'
      - 'scripts/release_manifest.py'
      - 'scripts/release_selftest.py'
      - 'scripts/audit_corpus.py'
      - 'scripts/fact_reverify.py'
      - 'scripts/sync_canon_js.py'
      - 'content/posts.json'
      - 'content/sources.json'
      - 'content/category-hubs.json'
      # Covered by the release code_baseline, so a change here invalidates it.
      - 'content/site.json'
      - 'content/affiliates.json'
      - 'templates/base.html'
      - 'assets/app.js'
      - 'assets/styles.css'
      - 'netlify/functions/**'
      - '.github/workflows/gate-selftest.yml'
  pull_request:
    paths: *selftest_paths

permissions:
  contents: read

jobs:
  offline:
    name: Deterministic self-tests (no API key)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Standard library only — these must not depend on requirements resolving.
      - name: Run quick-answer, routing and canon self-test
        run: python scripts/gate_quickanswer_selftest.py

      - name: Run hub loading, schema and ad-mode self-test
        run: python scripts/hub_selftest.py

      # Partition, similarity-exclusion and consolidation-graph validation.
      # The build-backed half runs in its own job below so this one stays fast.
      - name: Run corpus consolidation self-test (no build)
        run: python scripts/corpus_selftest.py --no-build

      # Exercises release_manifest.py's own control paths in throwaway copies.
      # CI watched the file but never ran it, so every control it advertises was
      # verified only by hand — which is how a consolidation stage that could
      # not be applied at all reached a "ready" manifest.
      - name: Run release-manifest control self-test
        run: python scripts/release_selftest.py

      # The Netlify Functions cannot import the Python canon, so they read a
      # GENERATED module. If content/sources.json moved and nobody re-rendered
      # it, the scam checker would keep serving the old routes.
      - name: Check the generated functions canon module is current
        run: python scripts/sync_canon_js.py --check

      # Pins the inseparable Report Fraud / Police Scotland pair at every input
      # position. Uses the runner's preinstalled Node and the built-in
      # node:test runner, so there is no action to pin and no dependency to
      # install.
      - name: Run Netlify Function unit tests
        run: node --test "netlify/functions/lib/*.test.js"

  corpus-build:
    name: Corpus consolidation, proved against a real build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Renders the whole site into a TEMP directory and asserts that a
      # consolidated record produces no page, no sitemap/RSS/search/llms.txt
      # entry, 301s from both URL forms, and is not linked from any rendered
      # page. Takes ~6 minutes because that is what a 185-post build costs, so
      # it runs beside the fast job rather than inside it. The committed dist/
      # is never written.
      - name: Run corpus consolidation self-test (with build)
        run: python scripts/corpus_selftest.py

      - name: Fail if the committed dist/ was modified
        run: git diff --exit-code -- dist

  llm:
    name: Model-backed gate fixtures (manual, spends API credit)
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-claude.txt

      - name: Run gate self-test
        run: python scripts/gate_selftest.py
