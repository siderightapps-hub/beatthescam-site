name: Daily AI Publish

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new topics to publish this run"
        required: false
        default: "1"
      rewrite_thin:
        description: "Rewrite thin guides? (true/false)"
        required: false
        default: "false"
      rewrite_limit:
        description: "Max thin guides to rewrite per run"
        required: false
        default: "10"
  schedule:
    # Daily at 05:07 UTC (06:07 BST). Re-enabled 2026-06-19 after the P1 accuracy
    # gate landed — generation now runs through scripts/content_gate.py (deterministic
    # checks + LLM judge) before anything is published or tweeted; failures are
    # quarantined. GitHub cron is best-effort and can be delayed by hours.
    - cron: '7 5 * * *'

permissions:
  contents: write

# Serialise with daily-search-console.yml: both pipelines regenerate
# dist/sitemap.xml from posts.json. Same group name in both files queues
# them instead of letting them race.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Scheduled runs have no inputs, so the fallback applies. Yesterday's
      # decision: 1 article/day from queue. 5 was the historical default
      # before that.
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '1' }}
      REWRITE_THIN: ${{ github.event.inputs.rewrite_thin || 'false' }}
      REWRITE_LIMIT: ${{ github.event.inputs.rewrite_limit || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main (catch any manual pushes)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-claude.txt

      - name: Publish new topics
        id: publish
        run: |
          OUTPUT=$(python scripts/run_daily_publish.py \
            --queue  content/daily-publish-queue.csv \
            --topics content/topics-claude-template.csv \
            --posts  content/posts.json \
            --batch-size "$BATCH_SIZE" \
            --model  claude-haiku-4-5-20251001 2>&1)
          echo "$OUTPUT"
          # Extract new slugs from the script's marker line (same convention as
          # scripts/search_console_articles.py) so the tweet step below can fire.
          SLUGS=$(echo "$OUTPUT" | grep "^NEW_ARTICLE_SLUGS=" | tail -1 | cut -d= -f2)
          echo "new_slugs=$SLUGS" >> $GITHUB_OUTPUT
          echo "Captured slugs for tweeting: $SLUGS"

      - name: Rewrite thin guides (optional)
        if: env.REWRITE_THIN == 'true'
        run: |
          python scripts/rewrite_thin_guides.py \
            --posts     content/posts.json \
            --threshold 400 \
            --limit     "$REWRITE_LIMIT" \
            --model     claude-haiku-4-5-20251001

      - name: Build site
        run: python scripts/build.py

      - name: Verify build produced output (fail loudly on silent build failures)
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found — build.py exited silently without producing output"
            exit 1
          fi
          if [ ! -f dist/robots.txt ]; then
            echo "ERROR: dist/robots.txt not found — build.py did not generate robots.txt"
            exit 1
          fi
          if [ ! -f dist/_redirects ]; then
            echo "ERROR: dist/_redirects not found — build.py did not generate _redirects"
            exit 1
          fi
          POST_COUNT=$(find dist/guides -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$POST_COUNT" -lt 50 ]; then
            echo "ERROR: only $POST_COUNT post directories found in dist/guides — build looks incomplete"
            exit 1
          fi
          echo "Build verified: $POST_COUNT post directories, all required files present"

      - name: Check if dist changed
        id: dist_changed
        run: |
          git add dist/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          git reset HEAD dist/

      - name: Commit content + dist (only if dist changed)
        if: steps.dist_changed.outputs.changed == 'true'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts.json \
                  content/topics-claude-template.csv \
                  content/daily-publish-queue.csv \
                  dist
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily AI publish: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "✅ Push succeeded on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt rejected (non-fast-forward) — retrying"
              sleep 5
              continue
            fi

            # Rebase conflict. dist/ is derived — never merge it. Snapshot our
            # content/* changes, hard-reset to fresh main, merge new posts in
            # by slug, take our CSVs as-is, rebuild dist/ from scratch.
            echo "Rebase conflict on attempt $attempt — recovering by snapshot + reset + rebuild"
            git rebase --abort || true
            cp content/posts.json                  /tmp/posts-ours.json
            cp content/topics-claude-template.csv  /tmp/topics-ours.csv
            cp content/daily-publish-queue.csv     /tmp/queue-ours.csv
            git reset --hard origin/main
            python scripts/merge_new_posts.py /tmp/posts-ours.json content/posts.json
            cp /tmp/topics-ours.csv  content/topics-claude-template.csv
            cp /tmp/queue-ours.csv   content/daily-publish-queue.csv

            git add content/posts.json \
                    content/topics-claude-template.csv \
                    content/daily-publish-queue.csv
            if git diff --cached --quiet; then
              echo "ℹ️  Our work was already on main — nothing to push"
              exit 0
            fi

            python scripts/build.py
            git add dist
            git commit -m "Daily AI publish: $(date -u +%Y-%m-%d)"
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Commit content only (no dist change)
        if: steps.dist_changed.outputs.changed == 'false'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts.json \
                  content/topics-claude-template.csv \
                  content/daily-publish-queue.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily AI publish (content only): $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "✅ Push succeeded on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt rejected (non-fast-forward) — retrying"
              sleep 5
              continue
            fi

            # Rebase conflict on content-only commit — same recovery pattern
            # as the content+dist case, just no rebuild needed.
            echo "Rebase conflict on attempt $attempt — recovering by snapshot + reset"
            git rebase --abort || true
            cp content/posts.json                  /tmp/posts-ours.json
            cp content/topics-claude-template.csv  /tmp/topics-ours.csv
            cp content/daily-publish-queue.csv     /tmp/queue-ours.csv
            git reset --hard origin/main
            python scripts/merge_new_posts.py /tmp/posts-ours.json content/posts.json
            cp /tmp/topics-ours.csv  content/topics-claude-template.csv
            cp /tmp/queue-ours.csv   content/daily-publish-queue.csv

            git add content/posts.json \
                    content/topics-claude-template.csv \
                    content/daily-publish-queue.csv
            if git diff --cached --quiet; then
              echo "ℹ️  Our work was already on main — nothing to push"
              exit 0
            fi
            git commit -m "Daily AI publish (content only): $(date -u +%Y-%m-%d)"
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
      # Always-on debug — prints the captured slug value before the if:
      # is evaluated, so we can see whether the slug-capture step is
      # producing the value we think it is.
      - name: Debug — what was captured?
        if: always()
        run: |
          echo "steps.publish.outputs.new_slugs = '${{ steps.publish.outputs.new_slugs }}'"
          echo "length: ${#NEW_SLUGS_DEBUG}"
        env:
          NEW_SLUGS_DEBUG: ${{ steps.publish.outputs.new_slugs }}

      - name: Tweet new articles
        # Explicit ${{ }} form + truthy check. The bare `!= ''` form
        # silently skipped on 2026-05-24 and 2026-05-25 even though the
        # publish step printed `Captured slugs for tweeting: <slug>`.
        # Forcing the expression evaluator avoids any implicit-parsing
        # ambiguity around how GitHub Actions reads step-output values.
        # Re-enabled 2026-06-19: new_slugs only ever contains gate-PASSED post slugs
        # (run_daily_publish emits NEW_ARTICLE_SLUGS from GATE_PUBLISHED), so this
        # only tweets content that cleared the fabrication checks.
        if: ${{ steps.publish.outputs.new_slugs != '' && steps.publish.outputs.new_slugs }}
        env:
          TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_KEY_SECRET:      ${{ secrets.TWITTER_API_KEY_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          # Write .env for tweet script
          cat > .env << EOF
          TWITTER_API_KEY=${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_KEY_SECRET=${{ secrets.TWITTER_API_KEY_SECRET }}
          TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET=${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          EOF

          # Ensure tweeted_posts.json exists
          if [ ! -f content/tweeted_posts.json ]; then
            echo "{}" > content/tweeted_posts.json
          fi

          # Tweet each new slug. Individual failures (e.g. duplicate-detection
          # suppression) don't kill the rest of the batch.
          SLUGS="${{ steps.publish.outputs.new_slugs }}"
          IFS=',' read -ra SLUG_ARRAY <<< "$SLUGS"
          for SLUG in "${SLUG_ARRAY[@]}"; do
            echo "🐦 Tweeting: $SLUG"
            python scripts/tweet_new_articles.py --slug "$SLUG" || echo "Tweet failed for $SLUG"
          done

          rm -f .env

      - name: Save updated tweeted_posts.json
        if: ${{ steps.publish.outputs.new_slugs != '' && steps.publish.outputs.new_slugs }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/tweeted_posts.json || true
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to tweeted_posts.json"
            exit 0
          fi
          git commit -m "Update tweeted_posts.json after daily-publish auto-tweet"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "✅ tweeted_posts.json pushed on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt rejected (non-fast-forward) — retrying"
              sleep 5
              continue
            fi

            # tweeted_posts.json is just a slug→timestamp dict; conflict means
            # another process added an entry. Snapshot ours, reset, python-merge
            # the dicts, re-commit.
            echo "Rebase conflict on attempt $attempt — recovering by snapshot + reset + merge"
            git rebase --abort || true
            cp content/tweeted_posts.json /tmp/tweeted-ours.json
            git reset --hard origin/main
            python -c "import json, pathlib; ours=json.loads(pathlib.Path('/tmp/tweeted-ours.json').read_text()); bp=pathlib.Path('content/tweeted_posts.json'); base=json.loads(bp.read_text()) if bp.exists() else {}; merged={**base, **ours}; bp.write_text(json.dumps(merged, indent=2, ensure_ascii=False)+chr(10)); print(f'Merged tweeted_posts.json: {len(merged)} entries')"
            if git diff --quiet content/tweeted_posts.json; then
              echo "ℹ️  Nothing new to record — exiting"
              exit 0
            fi
            git add content/tweeted_posts.json
            git commit -m "Update tweeted_posts.json after daily-publish auto-tweet"
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
