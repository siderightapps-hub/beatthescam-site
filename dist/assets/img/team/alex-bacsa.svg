<?xml version="1.0" encoding="UTF-8"?>
<!--
  Alex Bacsa — author monogram for Beat the Scam.
  Brand-aligned (navy #0b1220 background, accent blue #3a86ff ring,
  white "AB" letters). Replace with a real headshot when one is
  available — Google rewards real author photos for YMYL E-E-A-T.

  The previous "tuning-dial + head silhouette" SVG (still in use on
  sister site tuningdigital.com — where the name justifies it) was
  retired here on 2026-06-04. On a consumer-protection site whose
  readers already feel "targeted" by scammers, the concentric rings +
  cardinal ticks + centre eye-dot read as a sniper scope on a victim.
  Wrong polarity. Monogram is safer until a real headshot lands.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Alex Bacsa">
  <circle cx="80" cy="80" r="80" fill="#0b1220"/>
  <circle cx="80" cy="80" r="74" fill="none" stroke="#3a86ff" stroke-width="2" opacity="0.45"/>
  <text x="80" y="106"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="68" font-weight="700" fill="#ffffff"
        letter-spacing="-2">AB</text>
</svg>
