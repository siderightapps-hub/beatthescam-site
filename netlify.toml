# netlify.toml

[build]
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- dist/ netlify/"

[functions]
  directory = "netlify/functions"

# ─── SECURITY HEADERS (applied to all pages) ────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — disallow framing by other origins
    X-Frame-Options = "DENY"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Enforce HTTPS for 2 years (63072000s) — required for HSTS preload list submission
    # Once confirmed stable, submit at https://hstspreload.org
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Control referrer data sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrict browser feature access
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Prevent cross-origin pop-up attacks (tab-napping)
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Legacy XSS filter for older browsers (harmless on modern browsers)
    X-XSS-Protection = "1; mode=block"
    # Content Security Policy
    # unsafe-inline needed for inline scripts (GA4, checker page, AdSense)
    # unsafe-eval NOT present
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com https://partner.googleadservices.com https://tpc.googlesyndication.com https://adservice.google.com https://adservice.google.co.uk https://analytics.ahrefs.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://pagead2.googlesyndication.com https://www.google-analytics.com https://www.googletagmanager.com https://tpc.googlesyndication.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://analytics.ahrefs.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# ─── STATIC ASSETS — long cache, immutable ───────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── ADS.TXT — short cache so AdSense picks up changes quickly ───────────────
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

# ─── API ROUTE — no caching on dynamic responses ─────────────────────────────
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# ─── REDIRECTS ───────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/api/check-scam"
  to     = "/.netlify/functions/check-scam"
  status = 200

# Category slug 301 redirects live in dist/_redirects, not here.
# (The toml-based [[redirects]] blocks weren't being applied at edge
# even though API redirect and headers from this file work correctly.
# Cause unknown; _redirects file works, so we use that.)

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

[context.production.environment]
  NODE_VERSION = "20"