name: Daily Search Console Articles

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only — show gaps without generating (true/false)"
        required: false
        default: "false"
      days:
        description: "Days of Search Console data to analyse"
        required: false
        default: "28"
  schedule:
    # Tue/Fri at 05:23 UTC (06:23 BST) — reduced from daily on 2026-07-23,
    # matching daily-publish.yml. Queued behind daily-publish via the concurrency
    # group. The generator runs every draft through scripts/content_gate.py.
    #
    # HUMAN-REVIEW GATE (2026-06-25): like daily-publish.yml, this no longer
    # commits to main — it opens a review PR. Nothing is published, monetised, or
    # tweeted until a human merges. Auto-tweet lives in tweet-on-publish.yml.
    #
    # ── PAUSED 2026-07-26, RESUMED 2026-08-08 (operator instruction) ─────────
    # Paused alongside daily-publish.yml; resumed with it after the 2026-08-08
    # review defects were fixed at the generator and gate (#97). This workflow
    # shares generate_content_claude.py's writer and content_gate.py's checks,
    # so it inherits those fixes — and the same unguarded classes listed in
    # daily-publish.yml. Review each auto-content PR on those before merging.
    #
    # To pause again: comment out the `schedule:` key and the cron line below.
    - cron: '23 5 * * 2,5'

permissions:
  contents: write
  pull-requests: write
  issues: write          # gh label create manages labels via the issues API

# Serialise with daily-publish.yml: both pipelines branch off main and
# regenerate dist/sitemap.xml from posts.json. Same group name queues them.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  search-console-articles:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY:              ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SEARCH_CONSOLE_TOKEN:    ${{ secrets.GOOGLE_SEARCH_CONSOLE_TOKEN }}
      DRY_RUN:  ${{ github.event.inputs.dry_run || 'false' }}
      SC_DAYS:  ${{ github.event.inputs.days    || '28'    }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # Shared build/publish deps from the upper-bounded requirements file;
          # the Google API client trio is specific to this pipeline, pinned below.
          pip install -r requirements-claude.txt
          pip install \
            'google-auth-oauthlib>=1.0.0,<2.0.0' \
            'google-auth-httplib2>=0.2.0,<0.3.0' \
            'google-api-python-client>=2.0.0,<3.0.0'

      # The queue-state equivalent for this pipeline: while auto-content PRs are
      # open, generated guides haven't reached main's posts.json, so the same
      # search gap gets re-generated daily. Skip until the backlog is merged.
      - name: Skip if unmerged auto-content PRs exist
        id: backlog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh pr list --label auto-content --state open --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "ℹ️  $OPEN auto-content PR(s) awaiting review — skipping generation to avoid duplicate topics."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Search Console article generator
        if: steps.backlog.outputs.skip != 'true'
        id: generate
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/search_console_articles.py --dry-run --days "$SC_DAYS"
          else
            # Surface a real failure instead of swallowing it — a non-zero exit
            # here is usually an expired Search Console OAuth token (rotates
            # ~weekly), which means the gap pipeline is silently doing nothing.
            set +e
            OUTPUT=$(python scripts/search_console_articles.py --days "$SC_DAYS" --limit 1 2>&1)
            CODE=$?
            set -e
            echo "$OUTPUT"
            if [ "$CODE" -ne 0 ]; then
              echo "::error::Search Console article generator failed (exit $CODE) — check whether GOOGLE_SEARCH_CONSOLE_TOKEN was revoked, expired through inactivity, or is misconfigured."
              exit "$CODE"
            fi
            # The scraped output includes model-influenced text (titles, raw
            # responses on parse errors), so validate the charset before the
            # value becomes a step output — anything but slug chars is dropped.
            SLUGS=$(echo "$OUTPUT" | grep "^NEW_ARTICLE_SLUGS=" | tail -1 | cut -d= -f2)
            if ! echo "$SLUGS" | grep -Eq '^[a-z0-9,-]*$'; then
              echo "WARNING: scraped slug list failed charset validation; discarding: $(echo "$SLUGS" | head -c 200)"
              SLUGS=""
            fi
            echo "new_slugs=$SLUGS" >> $GITHUB_OUTPUT
            echo "Generated slugs: $SLUGS"
          fi

      # content/quarantine/ is gitignored by design (a gate-failed draft must
      # never risk landing in a commit/PR), so without this the human-review
      # record of what the gate blocked, and why, evaporates with the runner.
      # An artifact preserves it for review without touching the git tree.
      - name: Upload quarantined drafts (if any) for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarantined-drafts-${{ github.run_id }}
          path: content/quarantine/
          if-no-files-found: ignore
          retention-days: 30

      - name: Build site
        if: env.DRY_RUN != 'true' && steps.backlog.outputs.skip != 'true'
        run: python scripts/build.py

      - name: Verify build output
        if: env.DRY_RUN != 'true' && steps.backlog.outputs.skip != 'true'
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found"
            exit 1
          fi
          if [ ! -f dist/robots.txt ]; then
            echo "ERROR: dist/robots.txt not found"
            exit 1
          fi
          if [ ! -f dist/_redirects ]; then
            echo "ERROR: dist/_redirects not found"
            exit 1
          fi
          POST_COUNT=$(find dist/guides -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$POST_COUNT" -lt 50 ]; then
            echo "ERROR: only $POST_COUNT post directories found"
            exit 1
          fi
          echo "✅ Build verified: $POST_COUNT post directories"

      - name: Open review pull request
        if: env.DRY_RUN != 'true' && steps.backlog.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Step outputs must reach the script via env, never inline ${{ }} in
          # the run: body — inline interpolation happens before the shell runs,
          # so a spoofed marker line in the scraped output would become code.
          SLUGS: ${{ steps.generate.outputs.new_slugs }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/manifests/ content/posts.json dist/

          # Gate the PR on the REAL signal (posts.json / manifests), not dist/ or
          # queue churn — those change every run and would open an empty PR daily.
          # See daily-publish.yml for the full rationale.
          if git diff --cached --quiet -- content/posts.json content/manifests/; then
            echo "ℹ️  No new articles in posts.json this run — no PR to open."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/search-console-$(date -u +%Y%m%d)-${{ github.run_id }}"

          git checkout -b "$BRANCH"
          git commit -m "Search Console article (review): $DATE"
          git push origin "$BRANCH"

          gh label create auto-content --color 1f6feb --description "Auto-generated content awaiting editorial review" 2>/dev/null || true

          BODY=$(cat <<EOF
          Automated Search-Console gap-fill output for **editorial review**. Generated by Claude and passed the automated accuracy gate (\`scripts/content_gate.py\`). **Merging this PR publishes the guide(s) and enables advertising on them** — review before merging.

          **New guide slug(s):** \`${SLUGS:-none captured}\`

          ### Reviewer checklist
          - [ ] Reporting routes / phone numbers correct and from the verified canon
          - [ ] Reimbursement framing uses the mandatory APP rules (not the old CRM code)
          - [ ] No US-style "fraud alert / credit freeze" (UK = Cifas Protective Registration)
          - [ ] 7726 attributed to the mobile networks, not the NCSC
          - [ ] No unsafe threat-dismissal advice (esp. sextortion/deepfake guides)
          - [ ] Brand/domain claims are not false absolutes ("always/never")
          - [ ] Flag-tier notes in \`content/manifests/\` reviewed

          On merge, \`tweet-on-publish.yml\` will tweet the new guide(s).

          Any gate-quarantined draft(s) from this run are attached to the workflow run as a \`quarantined-drafts-${{ github.run_id }}\` artifact (never committed) — check the [run summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) if a topic seems to be missing.
          EOF
          )

          gh pr create --base main --head "$BRANCH" \
            --title "Search Console article for review: $DATE" \
            --body "$BODY" \
            --label auto-content \
          || gh pr create --base main --head "$BRANCH" \
            --title "Search Console article for review: $DATE" \
            --body "$BODY"

          echo "✅ Opened review PR from $BRANCH"
