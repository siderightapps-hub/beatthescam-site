name: Tweet on publish

# WP3A containment (2026-10-02): no automatic social publication on merge.
# Retained for explicitly approved manual promotion only. The before revision
# supplies the old push window; the selected main revision supplies its end.
on:
  workflow_dispatch:
    inputs:
      before:
        description: "Full commit SHA before the approved publication window"
        required: true
        type: string

permissions:
  contents: write

# Separate from content-pipeline. Retain the existing serialisation, three-slug
# cap, dedupe and recording logic for approved manual publication windows.
concurrency:
  group: tweet-on-publish
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Reject automatic invocation (WP3A containment)
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Automatic social publication is paused under WP3A; explicit approval and manual dispatch are required."
            exit 1
          fi
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::error::Social publication is restricted to main, as before containment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Determine newly published slugs (approved revision window)
        id: slugs
        env:
          BEFORE: ${{ inputs.before }}
        run: |
          # Fail visibly on an invalid manual window; never guess its start.
          if ! [[ "$BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$BEFORE" HEAD; then
            echo "::error::The before input must be a full commit SHA that is an ancestor of the selected revision."
            exit 1
          fi
          ADDED=$(python - <<'PY'
          import json, os, subprocess
          before = os.environ["BEFORE"]
          r = subprocess.run(["git", "show", f"{before}:content/posts.json"],
                             capture_output=True, text=True)
          old = set()
          if r.returncode == 0:
              try:
                  old = {p.get("slug") for p in json.loads(r.stdout)}
              except Exception:
                  old = set()
          with open("content/posts.json", encoding="utf-8") as f:
              new = json.load(f)
          added = [p.get("slug") for p in new if p.get("slug") and p.get("slug") not in old]
          print(",".join(added))
          PY
          )
          echo "Newly added slugs: '$ADDED'"
          # Safety cap: a normal merge adds 1 guide. More than 3 means a bulk
          # change (e.g. a corpus-wide edit) — never auto-tweet those.
          COUNT=$(awk -F, '{print ($0=="")?0:NF}' <<< "$ADDED")
          if [ "$COUNT" -gt 3 ]; then
            echo "::warning::$COUNT new slugs detected (> cap of 3) — skipping auto-tweet to avoid a burst. Tweet manually if intended."
            echo "new_slugs=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "new_slugs=$ADDED" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: ${{ steps.slugs.outputs.new_slugs != '' }}
        run: pip install -r requirements-claude.txt

      - name: Tweet new articles
        if: ${{ steps.slugs.outputs.new_slugs != '' }}
        env:
          # get_client() reads these via os.getenv — dotenv only seeds defaults,
          # so no .env file is needed (or written) on the runner.
          TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_KEY_SECRET:      ${{ secrets.TWITTER_API_KEY_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          SLUGS: ${{ steps.slugs.outputs.new_slugs }}
        run: |
          if [ ! -f content/tweeted_posts.json ]; then
            echo "{}" > content/tweeted_posts.json
          fi

          # tweet_new_articles.py dedupes against tweeted_posts.json, so even a
          # re-run cannot double-tweet. Individual failures don't kill the batch.
          IFS=',' read -ra SLUG_ARRAY <<< "$SLUGS"
          for SLUG in "${SLUG_ARRAY[@]}"; do
            [ -z "$SLUG" ] && continue
            echo "🐦 Tweeting: $SLUG"
            python scripts/tweet_new_articles.py --slug "$SLUG" || echo "Tweet failed for $SLUG"
          done

      - name: Save updated tweeted_posts.json
        if: ${{ steps.slugs.outputs.new_slugs != '' }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/tweeted_posts.json || true
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to tweeted_posts.json"
            exit 0
          fi
          git commit -m "Record auto-tweet after publish"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "✅ tweeted_posts.json pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            cp content/tweeted_posts.json /tmp/tweeted-ours.json
            git reset --hard origin/main
            python -c "import json,pathlib; ours=json.loads(pathlib.Path('/tmp/tweeted-ours.json').read_text()); bp=pathlib.Path('content/tweeted_posts.json'); base=json.loads(bp.read_text()) if bp.exists() else {}; bp.write_text(json.dumps({**base,**ours}, indent=2, ensure_ascii=False)+chr(10))"
            git add content/tweeted_posts.json
            git diff --cached --quiet && { echo "Nothing new to record"; exit 0; }
            git commit -m "Record auto-tweet after publish"
            sleep 5
          done
          echo "Push failed after 3 attempts"; exit 1
