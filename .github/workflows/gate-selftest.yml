name: Gate self-test

# Verification jobs run on every candidate; the paid suite remains manual.
#
# `offline` runs the deterministic self-tests — routing, canon, hub schema and
# ad modes. No API key, no network, so it runs AUTOMATICALLY on every push and
# pull request. That is
# the release property that matters: gate/validator/hub code cannot be merged
# while its deterministic checks are red or silently skipped (operator review,
# 2026-07-27 — before then nothing ran these in CI at all).
#
# `llm` runs the API-backed fixture suite against the existing ANTHROPIC_API_KEY
# secret, so it can be exercised without anyone holding the key locally. It
# spends money, so it stays manual: click "Run workflow" in the Actions tab.
# Side-effect-free: the self-tests never write posts.json or the quarantine, and
# no job commits.

on:
  workflow_dispatch:
  # Always run: the manifest binds the complete candidate input tree.
  push:
  pull_request:

env:
  PYTHONUTF8: '1'
  TZ: UTC
  LC_ALL: C
  LANG: C

permissions:
  contents: read

jobs:
  offline:
    name: Deterministic self-tests (no API key)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      # Only the small structured-host parser dependency; no model SDK or keys.
      - name: Install structured reporting dependency
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-reporting.lock'

      - name: Publication adapter and CLI security regressions (offline TEST keys)
        run: |
          python -I -B scripts/reporting_workflow_selftest.py
          python -I -B scripts/reporting_workflow_cli_selftest.py

      - name: Unicode network destination regressions (offline)
        run: python scripts/reporting_network_selftest.py

      - name: Bounded v2 contract model and semantic binding (offline fake keys)
        run: |
          python scripts/reporting_model_extension_selftest.py
          python scripts/reporting_model_binding_selftest.py

      - name: Bounded composed SMS and authenticated binding (offline TEST keys)
        run: |
          python scripts/reporting_composed_sms_selftest.py
          python scripts/reporting_composed_sms_binding_selftest.py

      - name: Independently confirmed canon fidelity and binding (offline fake keys)
        run: |
          python scripts/reporting_confirmed_contracts_selftest.py
          python scripts/reporting_confirmed_binding_selftest.py
          python scripts/reporting_eligibility_separation_selftest.py

      - name: Pilot eligibility, signing and exact-artifact regressions (offline fake keys)
        run: python scripts/reporting_pilot_selftest.py

      - name: Current page-scope consumption regressions (offline fake keys)
        run: python scripts/reporting_scope_selftest.py

      - name: Run structured reporting infrastructure self-test
        run: python scripts/reporting_structured_selftest.py

      - name: Restricted actions and authenticated review regressions (offline)
        run: python scripts/reporting_restricted_selftest.py

      - name: Action capability exclusivity and taxonomy regressions (offline)
        run: python scripts/reporting_exclusivity_selftest.py

      - name: Run structured security boundary regressions
        run: python scripts/reporting_security_selftest.py

      - name: Run effective output and offline writer integration regressions
        run: python scripts/reporting_output_selftest.py

      - name: Reporting provenance and prose approvals (offline)
        run: python scripts/reporting_provenance_selftest.py

      - name: Bounded R4 dependency, legacy HOLD and parser regressions (offline)
        run: python scripts/reporting_reconciliation_selftest.py

      - name: Run quick-answer, routing and canon self-test
        run: python scripts/gate_quickanswer_selftest.py

      - name: Run hub loading, schema and ad-mode self-test
        run: python scripts/hub_selftest.py

      # Partition, similarity-exclusion and consolidation-graph validation.
      # The build-backed half runs in its own job below so this one stays fast.
      - name: Run corpus consolidation self-test (no build)
        run: python scripts/corpus_selftest.py --no-build

      # The Netlify Functions cannot import the Python canon, so they read a
      # GENERATED module. If content/sources.json moved and nobody re-rendered
      # it, the scam checker would keep serving the old routes.
      - name: Check the generated functions canon module is current
        run: python scripts/sync_canon_js.py --check

      # Pins the inseparable Report Fraud / Police Scotland pair at every input
      # position. Uses the pinned Node and its built-in node:test runner.
      - name: Run Netlify Function unit tests
        run: node --test "netlify/functions/lib/*.test.js"

  corpus-build:
    name: Corpus consolidation, proved against a real build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install structured reporting dependency
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-reporting.lock'

      # Renders the whole site into a TEMP directory and asserts that a
      # consolidated record produces no page, no sitemap/RSS/search/llms.txt
      # entry, 301s from both URL forms, and is not linked from any rendered
      # page. Takes ~6 minutes because that is what a 185-post build costs, so
      # it runs beside the fast job rather than inside it. The committed dist/
      # is never written.
      - name: Run corpus consolidation self-test (with build)
        run: python scripts/corpus_selftest.py

      - name: Fail if the committed dist/ was modified
        run: git diff --exit-code -- dist

  pilot-artifact:
    name: Protected pilot artifact (holds until public trust enrollment)
    runs-on: ubuntu-24.04
    # This is a PUBLIC trust-root digest, not a signing secret. No private key
    # or deployment credential is available to PR code, including forks.
    env:
      BTS_REVIEW_ENVIRONMENT: production
      BTS_PRODUCTION_TRUST_SHA256: ${{ vars.BTS_PRODUCTION_TRUST_SHA256 }}
    steps:
      - name: Checkout verification inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install verification dependency
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-reporting.lock'
      - name: Lock-consistent Functions dependencies
        run: npm ci --ignore-scripts
      - name: Require measured runtime
        run: python scripts/reporting_runtime.py
      - name: Verify approvals and the exact committed artifact
        run: python scripts/reporting_pilot.py netlify-verify

  preactivation:
    name: TEST signing and runtime prerequisites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-reporting.lock'
      - run: python scripts/reporting_runtime.py
      - run: python scripts/reporting_preflight_selftest.py

  llm:
    name: Model-backed gate fixtures (manual, spends API credit)
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: pip install -r requirements-claude.txt

      - name: Run gate self-test
        run: python scripts/gate_selftest.py
